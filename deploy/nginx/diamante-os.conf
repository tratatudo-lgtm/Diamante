# Diamante OS V2 — main, store and admin portals
# Install as /etc/nginx/sites-enabled/diamante-os after reviewing existing vhosts.
# The application itself selects the public/store/admin portal from Host.
# Do not include the Evolution Manager hostname in this server block.

server {
    listen 80;
    listen [::]:80;
    server_name diamantedouro.duckdns.org loja-diamantedouro.duckdns.org admin-diamantedouro.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name diamantedouro.duckdns.org loja-diamantedouro.duckdns.org admin-diamantedouro.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/diamante-douro-domains/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diamante-douro-domains/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DiamanteOSSSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
