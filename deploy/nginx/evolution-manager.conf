# Evolution API / Manager — isolated from the Diamante OS portals.
# Keep HTTP Basic Auth in place. Do not add admin-diamantedouro.duckdns.org here.

server {
    listen 80;
    server_name evolution-diamantedouro.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name evolution-diamantedouro.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/evolution-diamantedouro.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evolution-diamantedouro.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EvolutionSSL:10m;
    ssl_session_timeout 1d;

    auth_basic "Evolution Manager";
    auth_basic_user_file /etc/nginx/.htpasswd-evolution-manager;

    location ^~ /manager/ {
        rewrite ^/manager/assets/(.*)$ /evo-assets/$1 break;
        proxy_pass http://127.0.0.1:9090/manager/dist/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /evo-assets/ {
        proxy_pass http://127.0.0.1:9090/manager/dist/assets/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000";
    }

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
