name: Security hardening CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [security/admin-api-auth-20261116]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: TypeScript validation
        run: bun run lint
      - name: Production frontend build
        run: bun run build
