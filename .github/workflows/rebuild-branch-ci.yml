name: Rebuild Branch CI

on:
  push:
    branches:
      - rebuild/diamante-douro-secure
    paths:
      - "**"
      - "!docs/**"
  pull_request:
    branches:
      - rebuild/diamante-douro-secure
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-branch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build
