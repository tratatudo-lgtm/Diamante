name: Diamante OS CI

on:
  push:
    branches:
      - main
      - rebuild/diamante-douro-secure
      - feat/admin-store-operations-20261117
      - integration/pr8-pr10-pr5-20261118
  pull_request:
    branches:
      - main
      - fix/purchase-idempotent-replay-20261116

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript validation
        run: bun run lint

      - name: Automated unit tests
        run: bun run test

      - name: Production build
        run: bun run build
